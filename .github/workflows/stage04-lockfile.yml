name: Stage 04 Lockfile Refresh

on:
  push:
    branches:
      - 'stage/04-ball-physics'
    paths:
      - '.github/workflows/stage04-lockfile.yml'
      - 'apps/web/package.json'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --lockfile-only
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(stage04): refresh workspace lockfile'
          git push origin HEAD:stage/04-ball-physics
