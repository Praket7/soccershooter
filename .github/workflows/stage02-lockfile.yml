name: Stage 02 lockfile bootstrap

on:
  push:
    branches:
      - 'stage/02-foundation'
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - '.github/workflows/stage02-lockfile.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: stage/02-foundation
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@12.9.1
      - name: Generate lockfile
        run: pnpm install --lockfile-only
      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'pnpm-lock.yaml already matches manifests.'
          else
            git commit -m 'build(stage02): generate pnpm lockfile'
            git push origin HEAD:stage/02-foundation
          fi
