name: Apply verified stress quality patch

on:
  push:
    branches:
      - 'stress/stages-01-10-simulation'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stress transport branch
        uses: actions/checkout@v7
        with:
          ref: stress/stages-01-10-simulation
          path: patch-source

      - name: Checkout Stage 1-10 foundation branch
        uses: actions/checkout@v7
        with:
          ref: finish/stages-01-10-foundation
          path: target
          fetch-depth: 0

      - name: Reassemble and apply locally verified patch
        run: |
          cat patch-source/.tmp/stress-quality.patch.part* > /tmp/stress-quality.patch
          git -C target apply --check /tmp/stress-quality.patch
          git -C target apply /tmp/stress-quality.patch
          git -C target diff --check

      - name: Commit and push product changes only
        run: |
          git -C target config user.name 'Praket7'
          git -C target config user.email '149203433+Praket7@users.noreply.github.com'
          git -C target add \
            packages/content/src/techniques/schema.ts \
            packages/content/src/techniques/catalog.ts \
            packages/content/src/techniques/catalog.test.ts \
            packages/sim/src/techniques/executeTechnique.ts \
            packages/sim/src/techniques/executeTechnique.test.ts \
            apps/web/src/dev/FootballPractice.ts \
            tools/balance/techniqueTournament.ts \
            tools/balance/techniqueTournament.test.ts \
            packages/progression/src/campaign.ts \
            packages/progression/src/progression.test.ts \
            e2e/stage08-techniques.spec.ts
          git -C target diff --cached --check
          git -C target commit -m 'fix: strengthen technique physics and campaign stress robustness'
          git -C target push origin HEAD:finish/stages-01-10-foundation
