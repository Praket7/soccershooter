name: Stage 02 RED contracts

on:
  push:
    branches:
      - 'stage/02-foundation'
  pull_request:
    paths:
      - 'packages/sim/**'
      - 'packages/protocol/**'
      - 'tools/security/**'
      - '.github/workflows/stage02-red.yml'

permissions:
  contents: read

jobs:
  red-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run Stage 02 foundation expectations
        run: >-
          npx --yes vitest@5.0.5 run
          packages/sim/src/determinism.test.ts
          packages/protocol/src/input.test.ts
          tools/security/guards.test.ts
          --reporter=verbose
