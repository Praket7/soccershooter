name: Stage 01 contracts

on:
  push:
    branches:
      - 'stage/01-product-contract'
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/telemetry/**'
      - '.github/workflows/stage01-contracts.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run Stage 01 Vitest contract suite
        run: npx --yes vitest@3.2.4 run packages/telemetry/src/schema.test.ts --reporter=verbose
