name: Stage 01 contracts

on:
  push:
    branches:
      - 'stage/01-product-contract'
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/telemetry/**'
      - '.github/workflows/stage01-contracts.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@12.9.1
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Run Stage 01 Vitest contract suite
        run: pnpm exec vitest run packages/telemetry/src/schema.test.ts --reporter=verbose
