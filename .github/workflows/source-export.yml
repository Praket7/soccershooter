name: Sandbox source export

on:
  push:
    branches:
      - 'stress/**'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@12.9.1

      - name: Install exact workspace
        run: pnpm install --frozen-lockfile

      - name: Install standalone Chromium
        run: pnpm exec playwright install chromium

      - name: Package sandbox runtime
        run: |
          mkdir -p /tmp/soccershooter-runtime/repo /tmp/soccershooter-runtime/bin /tmp/soccershooter-runtime/pnpm
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/soccershooter-runtime/repo
          cp "$(command -v node)" /tmp/soccershooter-runtime/bin/node
          cp -a "$(dirname "$(readlink -f "$(command -v pnpm)")")/.." /tmp/soccershooter-runtime/pnpm/package
          tar -C /tmp -czf /tmp/soccershooter-runtime.tgz soccershooter-runtime
          tar -C "$HOME/.cache" -czf /tmp/playwright-browser.tgz ms-playwright

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: soccershooter-runtime
          path: /tmp/soccershooter-runtime.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Playwright browser
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser
          path: /tmp/playwright-browser.tgz
          if-no-files-found: error
          retention-days: 1
