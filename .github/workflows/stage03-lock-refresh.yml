name: Stage 03 lockfile refresh

on:
  push:
    branches:
      - 'stage/03-movement-camera-input'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@12.9.1
      - name: Generate exact workspace lockfile
        run: pnpm install --lockfile-only
      - name: Commit lockfile if changed
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(stage03): refresh lockfile'
          git push
